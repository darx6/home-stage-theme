<!doctype html><html><head><meta charset="utf-8">
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>html,body{margin:0;background:#fff}model-viewer{width:100vw;height:100vh;background:#fff;--progress-bar-height:0}</style></head>
<body><model-viewer id="mv" interaction-prompt="none" shadow-intensity="1" shadow-softness="0.8" tone-mapping="neutral" environment-image="neutral" field-of-view="24deg"></model-viewer>
<script>
const q = new URLSearchParams(location.search), mv = document.getElementById('mv');
mv.setAttribute("exposure", String(Number(q.get("exp") || 1))); mv.cameraOrbit = q.get('orbit') || '-28deg 78deg auto';
mv.src = '../glb/' + q.get('m') + '.glb';
mv.addEventListener('load', () => setTimeout(() => document.title = 'READY', 400));
</script></body></html>
