<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sketchbook</title>
<style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#3B5B6B;font-family:Georgia,serif;color:#2A2522}
.top{height:60px;display:flex;justify-content:space-between;align-items:center;padding:0 40px;color:#F2EADB;font:16px 'Trebuchet MS',sans-serif}
.book{position:absolute;left:60px;right:60px;top:80px;bottom:40px;display:grid;grid-template-columns:1fr 1fr;background:#F2EADB;border-radius:6px;box-shadow:0 20px 40px rgba(0,0,0,.3)}
.book:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(0,0,0,.15)}
.l,.r{padding:50px}
.wash{height:360px;background:radial-gradient(ellipse at 50% 60%,#B6533A 0 30%,transparent 62%);opacity:.8;border-bottom:1px solid #2A2522;margin-top:40px}
h1{font:italic 700 58px Georgia,serif}.r p{font:16px 'Trebuchet MS',sans-serif;margin:8px 0}
.pins{display:flex;gap:14px;margin:24px 0}.pins i{width:84px;height:84px;display:block;transform:rotate(-3deg)}
.btn{display:inline-block;padding:18px 30px;background:#2A2522;color:#F2EADB;font:700 20px 'Trebuchet MS',sans-serif;margin-right:10px}
</style></head><body><div class="top"><b>HomeStage</b><span>Sofas · Bedding · Ceramics · Cart</span></div>
<div class="book"><div class="l"><p style="font:italic 18px Georgia">sketch no. 14, Linden</p><div class="wash"></div><p style="font:14px 'Trebuchet MS'">62 in ———————— · 31 in</p></div>
<div class="r"><h1>Linden two-seat sofa</h1><p>Made to order, delivered in 6–8 weeks</p><p style="font:700 32px Georgia">$2,180</p>
<div class="pins"><i style="background:#2F4B8B"></i><i style="background:#6D744B"></i><i style="background:#A7813E"></i><i style="background:#CABFAC"></i><i style="background:#6C3C4C"></i></div>
<span class="btn">Add to cart</span><span class="btn" style="background:none;color:#2A2522;border:2px solid">Order a sample</span></div></div></body></html>
