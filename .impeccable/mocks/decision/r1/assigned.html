<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Printed Cloth</title>
<style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;font-family:Georgia,'Trebuchet MS',sans-serif;background:#3E4A2C;color:#EFE6D2}
.selvedge{height:46px;background:#EFE6D2;color:#3E4A2C;display:flex;align-items:center;justify-content:space-between;padding:0 40px;font:600 15px 'Trebuchet MS',sans-serif;letter-spacing:.04em;border-bottom:6px dotted #3E4A2C}
.cloth{position:relative;height:854px;overflow:hidden}
.s{position:absolute;border-radius:50% 50% 46% 54%/60% 60% 40% 40%}
.a{background:#D9A43A;width:620px;height:420px;left:520px;top:-60px;transform:rotate(-8deg)}
.b{background:#8C2F4E;width:520px;height:360px;left:980px;top:330px;mix-blend-mode:multiply;transform:rotate(12deg)}
.c{background:#D9A43A;width:380px;height:260px;left:-80px;top:560px;transform:rotate(18deg)}
.d{background:#8C2F4E;width:260px;height:180px;left:300px;top:40px;mix-blend-mode:multiply}
.colourway{position:absolute;left:600px;top:120px;font:italic 700 120px Georgia,serif;color:#3E4A2C;opacity:.85}
.sofa{position:absolute;left:700px;top:330px;width:560px;height:250px;background:#2F4B8B;border-radius:120px 120px 30px 30px}
.label{position:absolute;left:60px;top:90px;width:430px;background:#EFE6D2;color:#2A2A22;padding:34px 34px 30px;border-radius:6px;box-shadow:0 18px 30px rgba(0,0,0,.25);transform:rotate(-1.2deg)}
.label:before{content:'';position:absolute;inset:8px;border:2px dashed #8C2F4E;border-radius:4px}
.label h1{font:700 64px/1 Georgia,serif;margin-bottom:12px}.label p{font:16px 'Trebuchet MS',sans-serif;margin:6px 0}
.price{font:700 34px Georgia,serif!important;margin:18px 0!important}
.btn{display:block;text-align:center;padding:20px;border-radius:40px;font:700 22px 'Trebuchet MS',sans-serif;margin-top:12px}
.btn.p{background:#3E4A2C;color:#EFE6D2}.btn.o{border:3px solid #3E4A2C;color:#3E4A2C}
.fab{position:absolute;left:700px;bottom:40px;display:flex;gap:18px}
.fab i{display:block;width:96px;height:96px;clip-path:polygon(0 6%,6% 0,12% 6%,18% 0,24% 6%,30% 0,36% 6%,42% 0,48% 6%,54% 0,60% 6%,66% 0,72% 6%,78% 0,84% 6%,90% 0,96% 6%,100% 0,100% 100%,0 100%)}
.fab i.on{transform:translateY(-18px) rotate(-4deg)}
</style></head><body>
<div class="selvedge"><span>HomeStage · Linden two-seat sofa · colourway No. 01 Cobalt</span><span>Sofas · Bedding · Ceramics · Cart</span></div>
<div class="cloth"><div class="s a"></div><div class="s b"></div><div class="s c"></div><div class="s d"></div>
<div class="colourway">cobalt wool</div><div class="sofa"></div>
<div class="label"><h1>Linden two-seat sofa</h1><p>Made to order, delivered in 6–8 weeks</p><p class="price">$2,180</p><span class="btn p">Add to cart</span><span class="btn o">Order a sample</span></div>
<div class="fab"><i class="on" style="background:#2F4B8B"></i><i style="background:#6D744B"></i><i style="background:#A7813E"></i><i style="background:#CABFAC"></i><i style="background:#3B3B3D"></i><i style="background:#6C3C4C"></i></div>
</div></body></html>
