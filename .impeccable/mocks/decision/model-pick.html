<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sample book</title>
<style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;background:#2E3B5B;font-family:Georgia,serif;color:#F1EEE6;overflow:hidden}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;font:14px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.fan{display:flex;gap:0;padding:20px 48px 0;height:300px}
.card{flex:1;margin-left:-18px;border:3px solid #F1EEE6;border-bottom:none;clip-path:polygon(0 0,100% 0,100% 100%,0 100%);position:relative}
.card:first-child{margin-left:0}.card span{position:absolute;bottom:14px;left:14px;font:13px Arial,sans-serif;color:#F1EEE6}
.main{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;padding:30px 48px}
.photo{height:470px;background:#C08A1E}
.info h1{font-size:72px;line-height:.95;font-weight:400}.info p{font:16px Arial,sans-serif;margin:14px 0}
.btn{display:inline-block;background:#F1EEE6;color:#2E3B5B;padding:20px 30px;font:700 22px Arial,sans-serif;margin-right:12px}.btn.o{background:none;color:#F1EEE6;border:2px solid #F1EEE6}
</style></head><body>
<div class="top"><span>HomeStage</span><span>The sample book</span><span>Cart</span></div>
<div class="fan"><div class="card" style="background:#C08A1E"><span>01 Mustard velvet</span></div><div class="card" style="background:#6B7350"><span>02 Moss bouclé</span></div><div class="card" style="background:#D8D1C2"><span>03 Oatmeal linen</span></div><div class="card" style="background:#2B2B2B"><span>04 Charcoal wool</span></div><div class="card" style="background:#7A3E48"><span>05 Plum cord</span></div><div class="card" style="background:#9AA6B0"><span>06 Slate weave</span></div></div>
<div class="main"><div class="photo"></div><div class="info"><h1>Linden Sofa in Mustard Velvet</h1><p>Made to order · 7–9 weeks · W 84 × D 38 × H 33 in</p><p style="font-size:34px;font-family:Georgia">$2,480</p><br><span class="btn">Add to cart</span><span class="btn o">Order this swatch</span></div></div>
</body></html>
