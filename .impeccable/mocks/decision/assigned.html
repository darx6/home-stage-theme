<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Catalogue spread</title>
<style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;background:#E9E7E0;font-family:"Helvetica Neue",Arial,sans-serif;color:#1C1B19;overflow:hidden}
.top{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;border-bottom:2px solid #1C1B19}
.spread{display:grid;grid-template-columns:1fr 1fr;height:856px}
.plate{background:#D29B2A;position:relative;padding:40px}
.plate .no{font-size:120px;font-weight:700;line-height:.8;color:#1C1B19;letter-spacing:-.03em}
.plate .sofa{position:absolute;left:60px;right:60px;bottom:120px;height:300px;background:#23418C;border-radius:40px 40px 10px 10px}
.plate .cap{position:absolute;left:40px;bottom:40px;font-size:14px;text-transform:uppercase;letter-spacing:.1em}
.page{padding:40px 56px;border-left:1px solid #1C1B19;display:grid;grid-template-rows:auto auto 1fr auto;gap:22px}
.page h1{font-size:76px;font-weight:700;letter-spacing:-.03em;line-height:.9}
.page .model{font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.ortho{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:18px;align-items:end}
.ortho div{border:2px solid #1C1B19;height:110px;position:relative}.ortho div:after{content:"";position:absolute;left:0;right:0;bottom:-14px;border-top:1px solid #1C1B19}
.fab{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.fab i{display:block;height:64px}
.row{display:flex;gap:14px;align-items:center}.buy{background:#1C1B19;color:#E9E7E0;padding:22px 34px;font-size:22px;font-weight:700}.smp{border:2px solid #1C1B19;padding:20px 26px;font-size:22px}
.price{font-size:40px;font-weight:700;margin-left:auto}
</style></head><body>
<div class="top"><span>HomeStage</span><span>Sofas · Bedding · Ceramics</span><span>Catalogue 07 · Cart</span></div>
<div class="spread">
<div class="plate"><div class="no">Plate 14</div><div class="sofa"></div><div class="cap">Linden three-seat · shown in Cobalt wool, No. 4</div></div>
<div class="page">
<div><div class="model">Model HS-301 · made to order · concept store</div><h1>Linden Sofa</h1></div>
<div class="ortho"><div></div><div></div><div></div></div>
<div><div class="model" style="margin-bottom:10px">Fabric range — six plates</div><div class="fab"><i style="background:#23418C"></i><i style="background:#4E5B31"></i><i style="background:#D29B2A"></i><i style="background:#8E8A80"></i><i style="background:#2B2B2B"></i><i style="background:#B9B3A5"></i></div></div>
<div class="row"><span class="buy">Add to cart</span><span class="smp">Order a sample</span><span class="price">$2,480</span></div>
</div></div></body></html>
